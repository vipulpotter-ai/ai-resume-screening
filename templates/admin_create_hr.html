<!DOCTYPE html>
<html>

<head>

    <title>Create HR</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="navbar">

    <h2>AI Resume Screening</h2>

    <a href="/admin/hr">
        HR Management
    </a>

</div>


<div class="login-container">

    <div class="login-box">

        <h1>Create HR Account</h1>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="HR Name"
                required
            >


            <input
                type="email"
                name="email"
                placeholder="HR Email"
                required
            >


            <input
                type="password"
                name="password"
                placeholder="HR Password"
                required
            >


            <button type="submit">
                Create HR
            </button>

        </form>

    </div>

</div>

</body>

</html>
