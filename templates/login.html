<!DOCTYPE html>
<html>

<head>

    <title>HR Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>AI Resume Screening</h1>

    <h2>HR Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="demo">
        Demo Login<br>
        Username: <b>admin</b><br>
        Password: <b>admin123</b>
    </p>

</div>

</body>

</html>
